<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Costeñol IDE</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- TOP NAVBAR -->
    <header class="navbar">
      <div class="logo">⚡ Costeñol</div>

      <button id="btnAnalizar" class="run-button">▶</button>
    </header>

    <!-- TABS -->
    <div class="tabs">
      <div class="tab active">main.pqek</div>
    </div>

    <!-- EDITOR -->
    <main class="editor-container">
      <!-- LINE NUMBERS -->
      <div class="line-numbers" id="lineNumbers">1</div>

      <!-- CODE -->
      <textarea
        id="codigo"
        spellcheck="false"
        placeholder="// Bienvenido a Costeñol 😎"
      ></textarea>
    </main>

    <!-- BOTTOM PANEL -->
    <footer class="bottom-panel">
      <div class="panel-header">PROBLEMAS</div>

      <div id="resultado"></div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
