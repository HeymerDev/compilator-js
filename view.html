<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Costeñol IDE</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- TOP NAVBAR -->
    <header class="navbar">
      <div class="logo">⚡ Costeñol IDE</div>

      <button id="btnAnalizar" class="run-button">▶</button>
    </header>

    <!-- TABS -->
    <div class="tabs">
      <div class="tab active">main.pqek</div>
    </div>

    <!-- EDITOR -->
    <main class="editor-container">
      <!-- LINE NUMBERS -->
      <div class="line-numbers" id="lineNumbers">1</div>

      <!-- CODE -->
      <div class="editor-code">
        <pre id="highlighting"></pre>

        <textarea
          id="codigo"
          spellcheck="false"
          placeholder="// Habla mi rey vas a programar a lo coleto que?, no y que eres loco 😎"
        ></textarea>
      </div>
    </main>

    <div class="resize-bar" id="resizeBar"></div>

    <!-- BOTTOM PANEL -->
    <footer class="bottom-panel">
      <div class="panel-header">TERMINAL</div>

      <div class="terminal">
        <div id="terminalOutput"></div>

        <div class="terminal-input-container">
          <span class="terminal-arrow">></span>

          <input type="text" id="terminalInput" autocomplete="off" />
        </div>
      </div>
    </footer>

    <script src="script.js" type="module"></script>
  </body>
</html>
